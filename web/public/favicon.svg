<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#0a1822"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a9384"/>
      <stop offset="1" stop-color="#1de3c6"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- lowercase "a": bowl (ring) + stem -->
  <g>
    <!-- ring / bowl -->
    <circle cx="212" cy="312" r="104" fill="none" stroke="#ffffff" stroke-width="46"/>
    <!-- stem on the right of the bowl -->
    <rect x="316" y="208" width="46" height="208" rx="23" fill="#ffffff"/>
  </g>

  <!-- plane flying up-right through the "a" -->
  <g transform="translate(126 356) rotate(-40) scale(12)" fill="url(#teal)">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
  </g>
</svg>
