<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Airpiv">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b4a"/>
      <stop offset="1" stop-color="#06143a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#bfeaff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="flight" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#18f0d0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Airpiv symbol: an open orbit / lowercase-a mark -->
  <path d="M365 177a150 150 0 1 0 0 158" fill="none" stroke="url(#mark)" stroke-width="48" stroke-linecap="round"/>
  <path d="M365 335v91" fill="none" stroke="url(#mark)" stroke-width="48" stroke-linecap="round"/>

  <!-- Upward flight path and airplane -->
  <path d="M105 356c78-8 150-48 218-93 38-25 68-48 101-76" fill="none" stroke="url(#flight)" stroke-width="22" stroke-linecap="round"/>
  <path d="M100 357c-18 2-29-4-35-13 18-1 35-6 50-14" fill="none" stroke="url(#flight)" stroke-width="16" stroke-linecap="round"/>
  <path d="M409 183l48-25-25 48-25-5-23 35-15-7 20-37-24-14 44 5z" fill="url(#flight)"/>
</svg>
