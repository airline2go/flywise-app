name: Repair X Pixel consent integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-x-pixel-consent.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair consent integration
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('web/public/index.html')
          s = index.read_text(encoding='utf-8')
          old = s
          s, n = re.subn(
              r'<!-- COOKIE -->\s*<div class="ck" id="ck">.*?</div>\s*<!-- BOTTOM NAV -->',
              '<!-- BOTTOM NAV -->',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected exactly one legacy cookie banner, removed {n}')
          index.write_text(s, encoding='utf-8')

          consent = Path('web/public/consent.js')
          s = consent.read_text(encoding='utf-8')
          old = s
          needle = "    window.airpivConsentState = { analytics: !!state.analytics, ad: !!state.ad };\n"
          replacement = needle + "\n    if (window.airpivConsentState.ad) {\n      try { window.dispatchEvent(new CustomEvent('airpiv:ad-consent-granted')); } catch (e) {}\n    }\n"
          if needle not in s:
              raise SystemExit('Consent state assignment not found')
          s = s.replace(needle, replacement, 1)
          consent.write_text(s, encoding='utf-8')

          pixel = Path('web/public/x-pixel.js')
          s = pixel.read_text(encoding='utf-8')
          needle = "  waitForConsent();\n"
          replacement = "  window.addEventListener('airpiv:ad-consent-granted', function () {\n    init();\n  });\n\n  waitForConsent();\n"
          if needle not in s:
              raise SystemExit('X Pixel consent polling entry point not found')
          s = s.replace(needle, replacement, 1)
          pixel.write_text(s, encoding='utf-8')

          if not any([index.read_text(encoding='utf-8') != old]):
              raise SystemExit('Homepage was not changed')

      - name: Commit repair and remove installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/index.html web/public/consent.js web/public/x-pixel.js
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix(tracking): remove duplicate consent UI and harden X Pixel init"
          git rm .github/workflows/fix-x-pixel-consent.yml
          git commit -m "chore: remove one-time X Pixel consent repair workflow"
          git push origin main
