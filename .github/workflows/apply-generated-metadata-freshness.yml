name: Apply generated metadata freshness fix

on:
  push:
    branches:
      - fix/seo-generated-metadata-freshness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact freshness invalidation and regression assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('web/lib/legacy-render/route-snapshot.js')
          text = source.read_text(encoding='utf-8')
          old = "  route.seo_intro_html = null;\n  route.seo_faq = null;\n  return true;"
          new = "  route.seo_title = null;\n  route.seo_meta_description = null;\n  route.seo_intro_html = null;\n  route.seo_faq = null;\n  return true;"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          source.write_text(text, encoding='utf-8')

          test = Path('web/test/content-api-generated-freshness.test.mjs')
          t = test.read_text(encoding='utf-8')
          old_assert = "  assert.equal(route.seo_intro_html, null);\n  assert.equal(route.seo_faq, null);"
          new_assert = "  assert.equal(route.seo_title, null);\n  assert.equal(route.seo_meta_description, null);\n  assert.equal(route.seo_intro_html, null);\n  assert.equal(route.seo_faq, null);"
          assert t.count(old_assert) == 1
          t = t.replace(old_assert, new_assert, 1)
          test.write_text(t, encoding='utf-8')
          PY
          git diff --check
          git diff --unified=0 -- web/lib/legacy-render/route-snapshot.js web/test/content-api-generated-freshness.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/lib/legacy-render/route-snapshot.js web/test/content-api-generated-freshness.test.mjs
          git rm .github/workflows/apply-generated-metadata-freshness.yml
          git commit -m "fix(seo): invalidate stale generated route metadata"
          git push origin HEAD:fix/seo-generated-metadata-freshness
