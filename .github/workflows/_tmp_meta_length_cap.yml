name: _tmp_meta_length_cap

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - fix/seo-meta-description-length-cap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply minimal metadata cap patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('web/lib/legacy-render/render-flight-route.js')
          text = source.read_text(encoding='utf-8')

          old = """  // [CANONICAL-PRICE-SOURCE] The \\\"ab/from …\\\" clause uses the ONE canonical
  // price (same value the title facet, hero fallback and Offer use), so the
  // SERP snippet never advertises a figure the page itself doesn't show.
  if (cp) {
    const price = formatRoutePrice(cp.amount, cp.currency, lang);
    return base + format(translate('routeMetaPrice', lang), { price });
  }
  return base;
}"""

          new = """  // [CANONICAL-PRICE-SOURCE] The \\\"ab/from …\\\" clause uses the ONE canonical
  // price (same value the title facet, hero fallback and Offer use), so the
  // SERP snippet never advertises a figure the page itself doesn't show.
  const priceClause = cp
    ? format(translate('routeMetaPrice', lang), { price: formatRoutePrice(cp.amount, cp.currency, lang) })
    : '';

  // [META-DESCRIPTION-LENGTH-CAP] Keep descriptions below the ~160-character
  // SERP display envelope without chopping sentences or inventing copy. When
  // the full factual facet set is too long, drop lower-priority facets as whole
  // localized phrases and rebuild the sentence. Price stays until the final
  // fallback because it is a primary route intent signal.
  const renderDescription = (selectedFacets, includePrice = true) => {
    const renderedBase = selectedFacets.length
      ? format(translate('routeMetaFrame', lang), {
        ...vars,
        facets: new Intl.ListFormat(getLanguage(lang).locale, { style: 'long', type: 'conjunction' }).format(selectedFacets),
      })
      : format(translate('routeMetaNoFacets', lang), vars);
    return renderedBase + (includePrice && priceClause ? priceClause : '');
  };

  let description = renderDescription(facets);
  if (description.length <= 160) return description;

  const removableFacetKeys = [
    'routeMetaFacetDistance',
    'routeMetaFacetDirect',
    'routeMetaFacetAirlines',
    'routeMetaFacetDuration',
  ];
  for (const key of removableFacetKeys) {
    const label = translate(key, lang);
    const idx = facets.indexOf(label);
    if (idx === -1) continue;
    facets.splice(idx, 1);
    description = renderDescription(facets);
    if (description.length <= 160) return description;
  }

  // [META-DESCRIPTION-LENGTH-CAP] Extreme city-name combinations fall back to
  // the localized no-facet sentence rather than truncating text mid-word. This
  // still preserves the route pair and omits only optional claims.
  return renderDescription([], false);
}"""

          assert old in text, "expected meta tail not found; aborting"
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('web/test/route-meta-length.test.mjs')
          test.write_text("""import assert from 'node:assert/strict';
import { createRequire } from 'node:module';

const require = createRequire(import.meta.url);
const { buildRouteMetaDescription } = require('../lib/legacy-render/render-flight-route.js');

const route = {
  slug: 'palma-de-mallorca-berlin',
  origin_city: 'Palma de Mallorca',
  destination_city: 'Berlin',
  origin_iata: 'PMI',
  destination_iata: 'BER',
  distance_km: 1646,
  avg_duration_min: 322,
  min_duration_min: 170,
  direct_flight_available: true,
  all_direct: false,
  route_score_confidence: 'high',
  price_min: 92.14,
  price_currency: 'EUR',
  price_sample_count: 5,
  price_updated_at: '2026-09-17T17:21:09.278Z',
  airlines: Array.from({ length: 20 }, (_, i) => ({ iata_code: `X${String(i).padStart(2, '0')}` })),
};

for (const lang of ['de', 'en', 'ar', 'es', 'fr', 'it', 'nl', 'tr']) {
  const description = buildRouteMetaDescription(route, lang);
  assert.ok(description.length <= 160, `${lang} meta description is ${description.length} chars: ${description}`);
  assert.equal(description.includes('…'), false, `${lang} description was truncated mid-sentence: ${description}`);
}

const french = buildRouteMetaDescription(route, 'fr');
assert.ok(french.length <= 160, `French metadata remained too long: ${french.length}`);
assert.match(french, /92/, `French metadata lost the real price unexpectedly: ${french}`);
""", encoding='utf-8')
          PY
      - name: Verify diff
        run: |
          git diff --check
          git diff -- web/lib/legacy-render/render-flight-route.js web/test/route-meta-length.test.mjs
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "airline2go"
          git config user.email "ghytly25@gmail.com"
          git add web/lib/legacy-render/render-flight-route.js web/test/route-meta-length.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(seo): cap route meta descriptions at 160 chars"
          git push origin HEAD
