name: CI Checks (Frontend)

# Production source of truth is the Next.js app in web/ (served via
# web/app/[lang]/…/route.js -> web/lib/legacy-render/). This pipeline BUILDS
# AND TESTS that real production app, and those checks are BLOCKING: lint,
# tests, and the production build must all pass before a change can merge/deploy.
#
# The root-level static assets (root *.html, app.js, build/*) are LEGACY. The
# build/ generators are a deprecated standalone SSG whose output is NOT deployed
# (see build/README.md). We keep a fast, deterministic syntax check for the
# still-checked-in legacy assets, but production correctness is gated by the
# `web` and `web-build` jobs below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── BLOCKING: production app lint + unit/integration tests ────────────────
  # Fully deterministic and offline (generateStaticParams returns []; the test
  # suite uses fixtures). A failure here must block merge/deploy.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: Lint (production app source)
        run: npm run lint

      - name: Test (production test suite)
        run: npm test

  # ── BLOCKING: real production build ───────────────────────────────────────
  # `next build` does not depend on the backend to enumerate pages
  # (generateStaticParams returns []), and the pre-build prerender/stamp scripts
  # are defensive (they warn and exit 0 on any failure), so this is safe to gate
  # on. A genuine build break (bad import, type/syntax error, bad next.config)
  # fails here and blocks deploy.
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: Production build
        run: npm run build

  # ── Legacy static assets: fast deterministic syntax check (blocking) ──────
  # Catches a typo that would break the still-checked-in root static site.
  # These are NOT the deployed production frontend, but a syntax error here is
  # cheap to catch and never a false positive.
  legacy-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check root standalone scripts syntax
        run: |
          for f in app.js admin.js config.js analytics.js canonical-fix.js popular-routes.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Check deprecated build/*.js syntax
        run: for f in build/*.js; do node --check "$f"; done

      - name: Check inline <script> blocks in every root HTML page
        run: |
          node -e "
          const fs = require('fs');
          const vm = require('vm');

          const htmlFiles = fs.readdirSync('.').filter(f => f.endsWith('.html'));
          let failed = false;

          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            blocks.forEach((m, i) => {
              try {
                new vm.Script(m[1]);
              } catch (e) {
                failed = true;
                console.error(\`❌ \${file} — inline <script> block #\${i}: \${e.message}\`);
              }
            });
          }

          if (failed) {
            console.error('\\nOne or more inline <script> blocks failed to parse.');
            process.exit(1);
          } else {
            console.log(\`✅ All inline <script> blocks parsed cleanly across \${htmlFiles.length} HTML files.\`);
          }
          "
