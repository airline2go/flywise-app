name: CI Checks (Frontend)

# Production source of truth is the Next.js app in web/ (served via
# web/app/[lang]/…/route.js -> web/lib/legacy-render/). This pipeline BUILDS
# AND TESTS that real production app, and those checks are BLOCKING: lint,
# tests, and the production build must all pass before a change can merge/deploy.
#
# The root-level static frontend and build/ SSG are retired. Production is
# served from web/; keeping CI independent of the retired tree is required
# before that tree can be removed safely.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: Lint (production app source)
        run: npm run lint

      - name: Test (production test suite)
        run: npm test

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: Production build
        run: npm run build
