name: Install X Pixel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[x-pixel-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch X Pixel integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('web/public/index.html')
          s = index.read_text()
          old = s
          csp_old = 'https://cdn.jsdelivr.net https://conversations-widget.brevo.com'
          csp_new = 'https://cdn.jsdelivr.net https://static.ads-twitter.com https://conversations-widget.brevo.com'
          if csp_old in s and 'https://static.ads-twitter.com' not in s.split('script-src',1)[1].split(';',1)[0]:
              s = s.replace(csp_old, csp_new, 1)
          conn_old = 'https://www.google.com; img-src \'self\' data: https:;'
          conn_new = 'https://www.google.com https://ads-twitter.com https://ads-api.twitter.com https://analytics.twitter.com; img-src \'self\' data: https://ads-twitter.com https://analytics.twitter.com;'
          if conn_old in s:
              s = s.replace(conn_old, conn_new, 1)
          marker = '<script src="/consent.js" defer></script>'
          if marker in s and '<script src="/x-pixel.js" defer></script>' not in s:
              s = s.replace(marker, marker + '\n<script src="/x-pixel.js" defer></script>', 1)
          if s == old:
              raise SystemExit('index.html was not patched')
          index.write_text(s)

          shell = Path('web/lib/legacy-render/shell.js')
          s = shell.read_text()
          old = s
          marker = '<script src="/consent.js" defer></script>'
          if marker in s and '<script src="/x-pixel.js" defer></script>' not in s:
              s = s.replace(marker, marker + '\n<script src="/x-pixel.js" defer></script>', 1)
          if s == old:
              raise SystemExit('shell.js was not patched')
          shell.write_text(s)
          PY

      - name: Commit X Pixel integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/index.html web/lib/legacy-render/shell.js
          git diff --cached --quiet && exit 0
          git commit -m 'chore: install X conversion pixel [x-pixel-installed]'
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/install-x-pixel.yml
          git commit -m 'chore: remove one-time X Pixel installer [x-pixel-installed]'
          git push
