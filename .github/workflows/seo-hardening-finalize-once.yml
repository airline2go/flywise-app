name: Airpiv SEO hardening finalize (one-shot)
on:
  push:
    branches: [fix/airpiv-seo-hardening-final-2026-09-16]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply exact final fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              p.write_text(s.replace(old, new, 1))

          shell = Path('web/lib/legacy-render/shell.js')
          s = shell.read_text()
          if 'route-hero-badges' not in s[s.find('const sanitizedMainContent'):s.find('const sanitizedMainContent') + 600]:
              marker = '''  const sanitizedMainContent = String(mainContent || '')\n'''
              if s.count(marker) != 1:
                  raise SystemExit('sanitizedMainContent marker mismatch')
              s = s.replace(
                  '''  const sanitizedMainContent = String(mainContent || '')\n    .replace(/<section class=\\"route-besttime-section\\">[\\s\\S]*?<\\/section>/g, '')\n    .replace(/<div class=\\"route-faq-item\\"><div class=\\"route-faq-q\\"><\\/div><div class=\\"route-faq-a\\"><\\/div><\\/div>/g, '');''',
                  '''  const sanitizedMainContent = String(mainContent || '')\n    .replace(/<section class=\\"route-besttime-section\\">[\\s\\S]*?<\\/section>/g, '')\n    .replace(/<div class=\\"route-faq-item\\"><div class=\\"route-faq-q\\"><\\/div><div class=\\"route-faq-a\\"><\\/div><\\/div>/g, '')\n    .replace(/<div class=\\"route-hero-badges\\">[\\s\\S]*?<\\/div>/g, '');''',
                  1,
              )
              shell.write_text(s)

          replace_once(
              'web/lib/legacy-render/ttl.js',
              '// Actual production sitemap windows: the index and shard are hourly, while\n// the route-type child sitemap is refreshed every 15 minutes.\nconst SITEMAP_REVALIDATE_S = HOUR / 1000;\nconst SITEMAP_ROUTE_REVALIDATE_S = 15 * MINUTE / 1000;\nconst SITEMAP_SHARD_REVALIDATE_S = HOUR / 1000;',
              '// Actual production sitemap windows: the index is hourly, while the\n// route-type child sitemap and overflow shards are refreshed every 15 minutes.\nconst SITEMAP_REVALIDATE_S = HOUR / 1000;\nconst SITEMAP_ROUTE_REVALIDATE_S = 15 * MINUTE / 1000;\nconst SITEMAP_SHARD_REVALIDATE_S = 15 * MINUTE / 1000;',
              'central sitemap TTL policy',
          )

          replace_once(
              'web/test/render-seo-guards.test.mjs',
              "test('route with observed airlines is indexed', () => {\n  const { html } = renderFlightRoutePage(routeRow({ airline_count: 3 }), 'de', [], { fromOrigin: [], toDestination: [] });\n  assert.equal(robotsFrom(html), 'index, follow');\n});",
              "test('airline count alone is insufficient evidence for indexing', () => {\n  const { html } = renderFlightRoutePage(routeRow({ airline_count: 3 }), 'de', [], { fromOrigin: [], toDestination: [] });\n  assert.equal(robotsFrom(html), 'noindex, follow');\n});\n\ntest('route with observed airline count plus real duration is indexed', () => {\n  const { html } = renderFlightRoutePage(routeRow({ airline_count: 3, min_duration_min: 90 }), 'de', [], { fromOrigin: [], toDestination: [] });\n  assert.equal(robotsFrom(html), 'index, follow');\n});",
              'evidence indexability regression',
          )

          test = Path('web/test/seo-route-hardening.test.mjs')
          t = test.read_text()
          marker = "const sitemapPath = path.resolve(process.cwd(), 'app/sitemap-shard/[file]/route.js');"
          if 'assert.doesNotMatch(rendered, /route-hero-badges/);' not in t:
              if t.count(marker) != 1:
                  raise SystemExit('seo hardening test marker mismatch')
              addition = '''const rendered = shell.renderShell({\n  lang: 'de',\n  title: 'Test',\n  description: 'Test',\n  canonicalUrl: 'https://airpiv.com/flights/test-test',\n  urls: { de: 'https://airpiv.com/flights/test-test', en: 'https://airpiv.com/en/flights/test-test' },\n  mainContent: '<div class="route-hero-badges"><span>✓ 600+ Airlines</span></div><section class="route-besttime-section"><p>Best time Tuesday</p></section><div class="route-faq-item"><div class="route-faq-q"></div><div class="route-faq-a"></div></div>',\n});\nassert.doesNotMatch(rendered, /route-hero-badges/);\nassert.doesNotMatch(rendered, /600\\+ Airlines/);\nassert.doesNotMatch(rendered, /Best time Tuesday/);\n\nconst faqSchema = shell.jsonLdScript({\n  '@context': 'https://schema.org',\n  '@type': 'WebPage',\n  mainEntity: {\n    '@type': 'FAQPage',\n    mainEntity: [\n      { name: '', acceptedAnswer: { text: '' } },\n      { name: 'Valid', acceptedAnswer: { text: 'Valid answer' } },\n    ],\n  },\n});\nassert.ok(faqSchema.includes('\\"name\\":\\"Valid\\"'));\nassert.ok(!faqSchema.includes('\\"name\\":\\"\\"'));\n\n'''
              test.write_text(t.replace(marker, addition + marker, 1))
          PY
      - name: Verify full frontend suite
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run seo:flight-evidence
          npm run seo:route-integrity
          npm run build
      - name: Commit final fixes and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/seo-hardening-patch-once.yml .github/workflows/seo-hardening-finalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web .github/workflows/seo-hardening-patch-once.yml .github/workflows/seo-hardening-finalize-once.yml
          git commit -m 'fix(seo): finalize evidence gates and sitemap policy'
          git push origin HEAD:fix/airpiv-seo-hardening-final-2026-09-16
