name: Align sitemap TTL unit test

on:
  push:
    branches:
      - fix/seo-hub-evidence-cache-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update one assertion and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/test/ttl.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = '  assert.equal(ttl.SITEMAP_REVALIDATE_S, 60 * 60);'
          new = '  assert.equal(ttl.SITEMAP_REVALIDATE_S, 0);'
          assert text.count(old) == 1
          assert new not in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff --unified=0 -- web/test/ttl.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/test/ttl.test.mjs
          git rm -f .github/workflows/align-sitemap-ttl-test.yml
          git commit -m "test(seo): align sitemap TTL assertion"
          git push origin HEAD:fix/seo-hub-evidence-cache-parity
