name: Apply hub evidence cache parity fix

on:
  push:
    branches:
      - fix/seo-hub-evidence-cache-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply minimal hub-detail cache change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/lib/content-api.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "const data = await fetchDetailOrNull(`/cities/${encodeURIComponent(slug)}`);": "const data = await fetchDetailOrNull(`/cities/${encodeURIComponent(slug)}`, { revalidate: ROUTE_DETAIL_REVALIDATE });",
              "const data = await fetchDetailOrNull(`/countries/${encodeURIComponent(code)}`);": "const data = await fetchDetailOrNull(`/countries/${encodeURIComponent(code)}`, { revalidate: ROUTE_DETAIL_REVALIDATE });",
              "const data = await fetchDetailOrNull(`/airports/${encodeURIComponent(code)}`);": "const data = await fetchDetailOrNull(`/airports/${encodeURIComponent(code)}`, { revalidate: ROUTE_DETAIL_REVALIDATE });",
              "const data = await fetchDetailOrNull(`/airlines/${encodeURIComponent(code)}`);": "const data = await fetchDetailOrNull(`/airlines/${encodeURIComponent(code)}`, { revalidate: ROUTE_DETAIL_REVALIDATE });",
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, f'expected exactly one occurrence: {old}'
              assert new not in text, f'target already present: {new}'
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat > web/test/content-api-hub-cache.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { fileURLToPath } from 'node:url';
          import { dirname, join } from 'node:path';

          const ROOT = dirname(dirname(fileURLToPath(import.meta.url)));
          const sourcePath = join(ROOT, 'lib', 'content-api.js');

          test('hub entity detail feeds use the same 15-minute revalidation as route evidence', async () => {
            const source = await readFile(sourcePath, 'utf8');
            const expected = [
              "fetchDetailOrNull(`/cities/${encodeURIComponent(slug)}`, { revalidate: ROUTE_DETAIL_REVALIDATE })",
              "fetchDetailOrNull(`/countries/${encodeURIComponent(code)}`, { revalidate: ROUTE_DETAIL_REVALIDATE })",
              "fetchDetailOrNull(`/airports/${encodeURIComponent(code)}`, { revalidate: ROUTE_DETAIL_REVALIDATE })",
              "fetchDetailOrNull(`/airlines/${encodeURIComponent(code)}`, { revalidate: ROUTE_DETAIL_REVALIDATE })",
            ];
            for (const call of expected) assert.ok(source.includes(call), `missing hub cache policy: ${call}`);
          });
          EOF

      - name: Verify minimal diff
        shell: bash
        run: |
          git diff --check
          git diff --unified=0 -- web/lib/content-api.js web/test/content-api-hub-cache.test.mjs
          test "$(git diff --numstat -- web/lib/content-api.js | awk '{print $1}')" = "4"
          test "$(git diff --numstat -- web/lib/content-api.js | awk '{print $2}')" = "4"

      - name: Commit source/test and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/lib/content-api.js web/test/content-api-hub-cache.test.mjs
          git rm .github/workflows/apply-hub-evidence-cache-fix.yml
          git commit -m "fix(seo): align hub evidence cache with route freshness"
          git push origin HEAD:fix/seo-hub-evidence-cache-parity
